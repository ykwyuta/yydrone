name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (shared simulation)
        env:
          SIM_SEEDS: "2"
        run: cargo test --release -p yydrone-core -p yydrone-game

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build (WebAssembly)
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yydrone-web
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Windows)
        run: cargo build --release -p yydrone-win
      - uses: actions/upload-artifact@v4
        with:
          name: yydrone-windows
          path: target/release/yydrone.exe
